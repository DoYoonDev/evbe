spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:15432/evolve_db
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: false
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: redis
      port: 6379
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

message:
  path: ${MESSAGE_PATH:/data/locales}

security:
  jwt:
    secret-key: H6bQT12lFJYt6gCdaxFfOxK7Yd0yXTr1lBwfDWrFLyY=
    access-expiration-time: 10m
    refresh-expiration-time: 30m